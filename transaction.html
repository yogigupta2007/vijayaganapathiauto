<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transaction</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root { --bg:#0f172a; --text:#e5e7eb; --muted:#94a3b8; --gold:#f59e0b; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:#0b1020; color:var(--text); padding:16px;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{ width:100%; max-width:420px; }
    .card{
      background:#0a1020; border:1px solid rgba(148,163,184,.15);
      border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.45); overflow:hidden;
    }
    .hdr{ padding:16px 18px; border-bottom:1px solid rgba(148,163,184,.12); }
    .hdr h1{ margin:0; font-size:18px; }

    .details{
      margin:18px; border:1px solid rgba(148,163,184,.15);
      border-radius:12px; padding:12px 14px;
      background:rgba(2,6,23,.35); font-size:14px;
      line-height:1.5; color:#d1d5db;
    }
    .details div{ display:flex; justify-content:space-between; gap:10px; }
    .details .k{ color:var(--muted); }

    .state{ padding:0 18px 18px 18px; color:var(--muted); font-size:13px; }
    .err{ color:#f59e0b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hdr"><h1>Vijayaganapthi Auto</h1></div>

      <div class="details" id="detailsBox" style="display:none;">
        <div><span class="k">Customer</span><span id="custName">—</span></div>
        <div><span class="k">Txn amount</span><span id="custAmt">—</span></div>
        <div><span class="k">Generated on</span><span id="custTs">—</span></div>
      </div>

      <div class="state" id="stateMsg">Loading…</div>
    </div>
  </div>

  <script type="module">
    // === CONFIG: CHANGE THESE TO YOUR PROJECT ===
    const SUPABASE_URL = 'https://qwwwiknpaypvahgdwrlc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d3dpa25wYXlwdmFoZ2R3cmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0NTQ1OTUsImV4cCI6MjA3NDAzMDU5NX0.xqmg68pzmthq8qvoPjxhVvAz6w_AYzFOF13iZxF1e2Q';
    // ============================================
    const CUST_TABLE = 'Customers';
    const CT = { CID:'CID', NAME:'NAME', AMOUNT:'AMOUNT', TIME_STAMP:'TIME_STAMP' };

    const qs = new URLSearchParams(location.search);
    const linkId = qs.get('id');

    const $ = (id) => document.getElementById(id);
    const stateEl = $('stateMsg');
    const detailsBox = $('detailsBox'), custNameEl=$('custName'), custAmtEl=$('custAmt'), custTsEl=$('custTs');

    const fmtINR = (n) => {
      try { return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n||0)); }
      catch { return '₹ ' + Number(n||0).toLocaleString('en-IN'); }
    };

    async function sbFetch(url, opts){
      const h = {
        apikey: SUPABASE_ANON_KEY,
        Authorization:'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json',
        ...(opts?.headers||{})
      };
      const res = await fetch(url, { ...opts, headers: h });
      const text = await res.text();
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${text}`);
      try { return JSON.parse(text); } catch { return text; }
    }

    const custSelectUrl = (idVal) =>
      `${SUPABASE_URL}/rest/v1/${CUST_TABLE}?select=${CT.NAME},${CT.AMOUNT},${CT.TIME_STAMP}&${CT.CID}=eq.${encodeURIComponent(idVal)}&limit=1`;

    const loadCustomer = (idVal) => sbFetch(custSelectUrl(idVal));

    async function init(){
      if (!linkId){
        stateEl.innerHTML = '<span class="err">Missing ?id in URL.</span>';
        return;
      }

      try{
        const custArr = await loadCustomer(linkId);
        const cust = custArr[0];
        if (!cust){
          stateEl.innerHTML = '<span class="err">No customer record found for this link.</span>';
          return;
        }

        detailsBox.style.display = 'block';
        custNameEl.textContent = String(cust[CT.NAME] ?? '');
        custAmtEl.textContent = fmtINR(cust[CT.AMOUNT] ?? 0);

        const ts = cust[CT.TIME_STAMP];
        if (ts) {
          const d = new Date(ts);
          custTsEl.textContent = d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
        } else {
          custTsEl.textContent = '';
        }

        stateEl.textContent = 'Transaction details loaded.';
      }catch(e){
        console.error('GET error:', e);
        stateEl.innerHTML = '<span class="err">Error loading transaction details.</span>';
      }
    }
    init();
  </script>
</body>
</html>
