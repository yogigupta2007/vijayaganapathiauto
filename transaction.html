<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="color-scheme" content="light dark" />
  <style>
    :root { --bg:#0f172a; --text:#e5e7eb; --muted:#94a3b8; --gold:#f59e0b; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:#0b1020; color:var(--text); padding:16px;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{ width:100%; max-width:420px; }
    .card{
      background:#0a1020; border:1px solid rgba(148,163,184,.15);
      border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.45); overflow:hidden;
    }
    .hdr{ padding:12px 18px 16px 18px; border-bottom:1px solid rgba(148,163,184,.12); }
    .scratch-area{ position:relative; padding:18px 18px 0 18px; }
    .prize{
      position:relative; border-radius:14px;
      background:linear-gradient(180deg,rgba(2,6,23,.9),rgba(2,6,23,.85));
      border:1px solid rgba(148,163,184,.18);
      padding:28px 20px; text-align:center; overflow:hidden; margin-bottom:6px;
    }
    .label{ font-size:14px; color:var(--muted); margin-bottom:8px; }
    .amount{
      font-size:40px; line-height:1.1; font-weight:800;
      color:var(--gold); text-shadow:0 2px 12px rgba(245,158,11,.25);
    }
    #tierBadge{ margin-top:10px; font-size:12px; color:#e5e7eb; }

    canvas.scratcher{
      position:absolute; border-radius:14px; display:block;
      touch-action:none; z-index:10;
    }
    canvas.scratcher.used{ display:none; }
    .state{ padding:0 18px 18px 18px; color:var(--muted); font-size:13px; }
    .err{ color:#f59e0b; }

    .details{
      margin:0 18px 14px 18px;
      border:1px solid rgba(148,163,184,.15);
      border-radius:12px;
      padding:10px 14px;
      background:rgba(2,6,23,.35);
      font-size:14px; line-height:1.5; color:#d1d5db;
    }
    .details div{ display:flex; justify-content:space-between; gap:10px; }
    .details .k{ color:var(--muted); }

    .pill{
      display:inline-block; padding:2px 8px; border-radius:999px;
      font-size:11px; font-weight:600; margin-left:6px;
      text-transform:uppercase; letter-spacing:0.03em;
    }
    .pill-success{ background:#14532d; color:#bbf7d0; }
    .pill-danger{ background:#b91c1c; color:#fee2e2; }
    .pill-yellow{ background:#d97706; color:#fef3c7; }
  </style>
</head>

    function sizeCanvasToPrize(canvasEl) {
      const prize = document.getElementById('prize');
      const scratchAreaRect = prize.parentElement.getBoundingClientRect();
      const prizeRect = prize.getBoundingClientRect();

      canvasEl.style.left   = `${prizeRect.left - scratchAreaRect.left}px`;
      canvasEl.style.top    = `${prizeRect.top  - scratchAreaRect.top }px`;
      canvasEl.style.width  = `${prizeRect.width }px`;
      canvasEl.style.height = `${prizeRect.height}px`;

      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvasEl.width  = Math.floor(prizeRect.width  * dpr);
      canvasEl.height = Math.floor(prizeRect.height * dpr);

      const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,prizeRect.width,prizeRect.height);
      ctx.fillStyle = '#b8c0cc';
      ctx.fillRect(0,0,prizeRect.width,prizeRect.height);
      ctx.fillStyle = '#6b7280';
      ctx.font = '700 20px system-ui, -apple-system, Segoe UI, Roboto';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Scratch here', prizeRect.width/2, prizeRect.height/2);
      ctx.globalCompositeOperation = 'destination-out';
    }
